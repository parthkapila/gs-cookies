name: Upload Cookie Mapping to Render DB

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions UI
  schedule:
    - cron: '0 4 1 9 *'  # At 00:00 ET (04:00 UTC) on September 1st every year

jobs:
  upload-cookie-mapping:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: service_account.json
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install PyDrive2 openpyxl

      - name: Create service account key file
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > service_account.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Run cookie mapping upload script
        run: python backend/automation/upload_cookie_mapping_to_db.py
