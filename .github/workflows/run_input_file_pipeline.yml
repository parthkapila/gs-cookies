name: Cookie Sales Render Upload

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
  schedule:
    - cron: '0 4 1 7 *'  # At 00:00 ET (04:00 UTC) on July 1st every year

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: service_account.json
      RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install PyDrive2

      - name: Create service account key file
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > service_account.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Run cookie sales pipeline and upload to Render DB
        run: python backend/automation/run_pipeline.py
        
      - name: Ensure data consistency
        run: |
          echo "🔍 Running comprehensive data consistency checks..."
          python backend/automation/ensure_data_consistency.py
          echo "✅ Data consistency checks completed!"